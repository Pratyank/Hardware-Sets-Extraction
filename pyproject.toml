[project]
name = "hwsets"
version = "0.1.0"
description = "Grounded, deterministic extraction of door hardware sets from Division 08 specbook PDFs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
hwsets = "hwsets.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwsets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "pymupdf", "scipy", "scipy.*"]
ignore_missing_imports = true

# PyMuPDF ships partial annotations; only the I/O layer touches it.
[[tool.mypy.overrides]]
module = ["hwsets.ingest.*"]
disallow_untyped_calls = false
